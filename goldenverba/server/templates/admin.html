<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Create New User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        p#message {
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Admin Panel - Create New User</h1>
    <form id="userForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter user's email" required>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter user's password" required>
        
        <label for="weaviate_url">Weaviate URL:</label>
        <input type="text" id="weaviate_url" name="weaviate_url" placeholder="Enter Weaviate URL" required>
        
        <label for="weaviate_key">Weaviate API Key:</label>
        <input type="text" id="weaviate_key" name="weaviate_key" placeholder="Enter Weaviate API Key" required>
        
        <label for="role">Role:</label>
        <select id="role" name="role" required>
            <option value="BasicUser">Basic User</option>
            <option value="BasicUploadUser">Basic User (Upload)</option>
            <option value="Admin">Admin</option>
            <option value="RippleAdmin">Ripple Admin</option>
        </select>
        
        <button type="submit">Create User</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById("userForm").onsubmit = async (event) => {
            event.preventDefault();

            // Collect form data
            const formData = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                weaviate_url: document.getElementById("weaviate_url").value,
                weaviate_key: document.getElementById("weaviate_key").value,
                role: document.getElementById("role").value, // Capture selected role
            };

            // Get message element for feedback
            const message = document.getElementById("message");

            try {
                // Make POST request to create user
                const response = await fetch("/admin/create_user", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData),
                });

                // Parse response
                const result = await response.json();

                // Display success or error message
                if (response.ok) {
                    message.textContent = "User created successfully!";
                    message.style.color = "green";
                } else {
                    message.textContent = `Error: ${result.detail}`;
                    message.style.color = "red";
                }
            } catch (error) {
                // Handle request failure
                message.textContent = "Request failed. Please try again.";
                message.style.color = "red";
            }
        };
    </script>    
</body>
</html>
