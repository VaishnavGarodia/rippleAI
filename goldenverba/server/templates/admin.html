<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Create New User</title>
</head>
<body>
    <h1>Admin Panel - Create New User</h1>
    <form id="userForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <label for="weaviate_url">Weaviate URL:</label>
        <input type="text" id="weaviate_url" name="weaviate_url" required>
        <br>
        <label for="weaviate_key">Weaviate API Key:</label>
        <input type="text" id="weaviate_key" name="weaviate_key" required>
        <br>
        <button type="submit">Create User</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById("userForm").onsubmit = async (event) => {
            event.preventDefault();
            const formData = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                weaviate_url: document.getElementById("weaviate_url").value,
                weaviate_key: document.getElementById("weaviate_key").value,
            };
            const message = document.getElementById("message");
            try {
                const response = await fetch("/admin/create_user", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData),
                });
                const result = await response.json();
                message.textContent = response.ok ? "User created successfully!" : `Error: ${result.detail}`;
                message.style.color = response.ok ? "green" : "red";
            } catch (error) {
                message.textContent = "Request failed";
                message.style.color = "red";
            }
        };
    </script>    
</body>
</html>
